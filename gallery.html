<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRMLS Image Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            background: #333;
            aspect-ratio: 1;
        }
        
        .gallery-item:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        
        .image-number {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(102, 126, 234, 0.95);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9em;
            z-index: 10;
        }
        
        .gallery-item .label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px;
            font-size: 0.75em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        
        .gallery-item:hover .label {
            transform: translateY(0);
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            margin: auto;
            display: block;
            width: 90%;
            max-width: 900px;
            max-height: 80vh;
            object-fit: contain;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .close-modal {
            position: absolute;
            top: 30px;
            right: 45px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .close-modal:hover {
            color: #ccc;
        }
        
        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 30px;
            padding: 10px 20px;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .nav-button:hover {
            background: rgba(0,0,0,0.8);
        }
        
        .prev {
            left: 20px;
        }
        
        .next {
            right: 20px;
        }
        
        .image-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 5px;
        }
        
        .stats {
            text-align: center;
            color: white;
            margin-top: 30px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ FRMLS Image Gallery</h1>
        <div class="gallery" id="gallery"></div>
        <div class="stats">
            <p>Total Images: <span id="imageCount">0</span></p>
        </div>
    </div>
    
    <div id="modal" class="modal">
        <span class="close-modal">&times;</span>
        <button class="nav-button prev" onclick="changeImage(-1)">❮</button>
        <img class="modal-content" id="modal-img" src="">
        <button class="nav-button next" onclick="changeImage(1)">❯</button>
        <div class="image-counter">

            { src: 'temp_image_037CBDE9-D5FC-41DB-A4CE-37A1E790CD2A.jpeg', alt: 'Temp Image' }

        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const gallery = document.getElementById('gallery');

        // Build gallery
        function initGallery() {
            images.forEach((image, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                    <img src="${image.src}" alt="${image.alt}" loading="lazy">
                    <div class="image-number">#${index + 1}</div>
                    <div class="label">${image.alt}</div>
                `;
                item.onclick = () => openModal(index);
                gallery.appendChild(item);
            });
            
            document.getElementById('imageCount').textContent = images.length;
            document.getElementById('total-images').textContent = images.length;
        }

        // Open modal with image
        function openModal(index) {
            currentImageIndex = index;
            modal.style.display = 'block';
            updateModalImage();
        }

        // Update modal image
        function updateModalImage() {
            modalImg.src = images[currentImageIndex].src;
            document.getElementById('current-index').textContent = currentImageIndex + 1;
        }

        // Change image in modal
        function changeImage(n) {
            currentImageIndex += n;
            if (currentImageIndex >= images.length) currentImageIndex = 0;
            if (currentImageIndex < 0) currentImageIndex = images.length - 1;
            updateModalImage();
        }

        // Close modal
        document.querySelector('.close-modal').onclick = () => {
            modal.style.display = 'none';
        };

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (modal.style.display === 'block') {
                if (e.key === 'ArrowLeft') changeImage(-1);
                if (e.key === 'ArrowRight') changeImage(1);
                if (e.key === 'Escape') modal.style.display = 'none';
            }
        });

        // Close modal when clicking outside image
        modal.onclick = (e) => {
            if (e.target === modal) modal.style.display = 'none';
        };

        // Initialize on load
        window.addEventListener('load', initGallery);
