<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRMLS — Slides Gallery</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0a;
  --surface: #111;
  --border: rgba(255,255,255,0.08);
  --accent: #c4622d;
  --text: #e8e6e2;
  --dim: #666;
  --mono: 'DM Mono', 'Courier New', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── sidebar ── */
#sidebar {
  width: 220px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

#sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
}

#sidebar-header .brand {
  font-size: 13px;
  letter-spacing: 0.18em;
  color: var(--text);
  font-weight: 500;
}

#sidebar-header .sub {
  font-size: 10px;
  color: var(--dim);
  margin-top: 4px;
  letter-spacing: 0.08em;
}

.post-group { padding: 8px 0; border-bottom: 1px solid var(--border); }

.post-label {
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--dim);
  padding: 8px 20px 6px;
  text-transform: uppercase;
}

.post-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 20px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--dim);
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  transition: color 0.15s, background 0.15s;
  letter-spacing: 0.04em;
}

.post-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.post-btn.active { color: var(--text); }
.post-btn.active .dot { background: var(--accent); }

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #333;
  flex-shrink: 0;
  transition: background 0.15s;
}

/* ── main viewer ── */
#viewer {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#viewer-header {
  padding: 18px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

#post-title {
  font-size: 12px;
  letter-spacing: 0.14em;
  color: var(--text);
}

#slide-counter {
  font-size: 11px;
  color: var(--dim);
  letter-spacing: 0.08em;
}

/* ── carousel area ── */
#carousel-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  overflow: hidden;
  padding: 24px 0;
  position: relative;
}

#carousel-area img {
  max-height: 100%;
  max-width: 440px;
  width: auto;
  object-fit: contain;
  display: block;
  border-radius: 4px;
}

.nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--text);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  z-index: 10;
}
.nav-btn:hover { background: rgba(255,255,255,0.12); }
.nav-btn:disabled { opacity: 0.2; cursor: default; }
#btn-prev { left: 20px; }
#btn-next { right: 20px; }

/* ── thumbnails ── */
#thumbs {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  padding: 16px 32px;
  border-top: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
  align-items: center;
  justify-content: center;
}
#thumbs::-webkit-scrollbar { display: none; }

.thumb {
  width: 44px;
  height: 55px;
  border-radius: 3px;
  object-fit: cover;
  cursor: pointer;
  opacity: 0.45;
  border: 1px solid transparent;
  transition: opacity 0.15s, border-color 0.15s;
  flex-shrink: 0;
}
.thumb:hover { opacity: 0.75; }
.thumb.active {
  opacity: 1;
  border-color: var(--accent);
}
</style>
</head>
<body>

<nav id="sidebar">
  <div id="sidebar-header">
    <div class="brand">FRMLS</div>
    <div class="sub">slides gallery</div>
  </div>

  <div class="post-group">
    <div class="post-label">Tips</div>
    <button class="post-btn active" onclick="loadPost('tip01')" id="btn-tip01">
      <span class="dot"></span>Tip 01 — Moodboard
    </button>
    <button class="post-btn" onclick="loadPost('tip02')" id="btn-tip02">
      <span class="dot"></span>Tip 02 — Saves
    </button>
    <button class="post-btn" onclick="loadPost('tip03')" id="btn-tip03">
      <span class="dot"></span>Tip 03 — Aesthetic
    </button>
  </div>

  <div class="post-group">
    <div class="post-label">Posts</div>
    <button class="post-btn" onclick="loadPost('identity')" id="btn-identity">
      <span class="dot"></span>You Have No Identity
    </button>
    <button class="post-btn" onclick="loadPost('backwards')" id="btn-backwards">
      <span class="dot"></span>You're Doing It Backwards
    </button>
    <button class="post-btn" onclick="loadPost('tips')" id="btn-tips">
      <span class="dot"></span>47 Shopify Tips (free)
    </button>
    <button class="post-btn" onclick="loadPost('ai')" id="btn-ai">
      <span class="dot"></span>Everyone's Using AI
    </button>
    <button class="post-btn" onclick="loadPost('product')" id="btn-product">
      <span class="dot"></span>Product Isn't The Problem
    </button>
    <button class="post-btn" onclick="loadPost('quiet')" id="btn-quiet">
      <span class="dot"></span>Quiet Brands Win
    </button>
    <button class="post-btn" onclick="loadPost('aiprompts')" id="btn-aiprompts">
      <span class="dot"></span>5 AI Prompts (ChatGPT)
    </button>
    <button class="post-btn" onclick="loadPost('rebuilt')" id="btn-rebuilt">
      <span class="dot"></span>I Rebuilt FRMLS
    </button>
    <button class="post-btn" onclick="loadPost('skipped')" id="btn-skipped">
      <span class="dot"></span>Your Brand Is Getting Skipped
    </button>
    <button class="post-btn" onclick="loadPost('aigen')" id="btn-aigen">
      <span class="dot"></span>Your Brand Looks AI-Generated
    </button>
    <button class="post-btn" onclick="loadPost('draft')" id="btn-draft">
      <span class="dot"></span>You Have A Shopify Draft
    </button>
    <button class="post-btn" onclick="loadPost('selling')" id="btn-selling">
      <span class="dot"></span>Why Your Brand Isn't Selling
    </button>
  </div>

  <div class="post-group">
    <div class="post-label">Other</div>
    <button class="post-btn" onclick="loadPost('founder')" id="btn-founder">
      <span class="dot"></span>Founder Story
    </button>
  </div>
</nav>

<main id="viewer">
  <div id="viewer-header">
    <span id="post-title">TIP 01 — MOODBOARD &gt; PRODUCT</span>
    <span id="slide-counter">01 / 07</span>
  </div>

  <div id="carousel-area">
    <button class="nav-btn" id="btn-prev" onclick="prevSlide()">&#8592;</button>
    <img id="main-img" src="" alt="slide">
    <button class="nav-btn" id="btn-next" onclick="nextSlide()">&#8594;</button>
  </div>

  <div id="thumbs"></div>
</main>

<script>
const POSTS = {
  tip01: {
    title: 'TIP 01 — MOODBOARD > PRODUCT',
    folder: 'ig-tip01',
    count: 7,
  },
  tip02: {
    title: 'TIP 02 — SAVES > LIKES',
    folder: 'ig-tip02',
    count: 9,
  },
  tip03: {
    title: 'TIP 03 — YOUR AESTHETIC IS YOUR ALGORITHM',
    folder: 'ig-tip03',
    count: 9,
  },
  identity: {
    title: 'YOU HAVE NO IDENTITY.',
    folder: 'ig-identity',
    count: 9,
  },
  backwards: {
    title: "YOU'RE DOING IT BACKWARDS.",
    folder: 'ig-backwards',
    count: 8,
  },
  tips: {
    title: '47 SHOPIFY TIPS (FREE)',
    folder: 'ig-tips',
    count: 7,
  },
  founder: {
    title: 'FOUNDER STORY',
    folder: 'ig-founder',
    count: 10,
  },
  ai: {
    title: "EVERYONE'S USING AI. NOBODY'S USING IT FOR THIS.",
    folder: 'ig-ai',
    count: 9,
  },
  product: {
    title: "YOUR PRODUCT ISN'T THE PROBLEM.",
    folder: 'ig-product',
    count: 9,
  },
  quiet: {
    title: 'QUIET BRANDS WIN.',
    folder: 'ig-quiet',
    count: 9,
  },
  aiprompts: {
    title: '5 AI PROMPTS FOR CLOTHING BRANDS',
    folder: 'ig-aiprompts',
    count: 8,
  },
  rebuilt: {
    title: 'I REBUILT FRMLS.',
    folder: 'ig-rebuilt',
    count: 11,
  },
  skipped: {
    title: 'YOUR BRAND IS GETTING SKIPPED.',
    folder: 'ig-skipped',
    count: 8,
  },
  aigen: {
    title: 'YOUR BRAND LOOKS AI-GENERATED.',
    folder: 'ig-aigen',
    count: 9,
  },
  draft: {
    title: 'YOU HAVE A SHOPIFY DRAFT.',
    folder: 'ig-draft',
    count: 10,
  },
  selling: {
    title: "WHY YOUR CLOTHING BRAND ISN'T SELLING.",
    folder: 'ig-selling',
    count: 10,
  },
};

let currentPost = 'tip01';
let currentSlide = 1;

function loadPost(key) {
  currentPost = key;
  currentSlide = 1;

  // update sidebar active state
  document.querySelectorAll('.post-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + key).classList.add('active');

  render();
}

function render() {
  const post = POSTS[currentPost];

  // header
  document.getElementById('post-title').textContent = post.title;
  updateCounter();

  // main image
  setMainImg(currentSlide);

  // thumbnails
  const thumbs = document.getElementById('thumbs');
  thumbs.innerHTML = '';
  for (let i = 1; i <= post.count; i++) {
    const img = document.createElement('img');
    img.src = `${post.folder}/slide-${String(i).padStart(2, '0')}.png`;
    img.className = 'thumb' + (i === currentSlide ? ' active' : '');
    img.onclick = (function(n){ return () => goToSlide(n); })(i);
    thumbs.appendChild(img);
  }

  updateNav();
}

function setMainImg(n) {
  const post = POSTS[currentPost];
  document.getElementById('main-img').src = `${post.folder}/slide-${String(n).padStart(2, '0')}.png`;
}

function updateCounter() {
  const post = POSTS[currentPost];
  const s = String(currentSlide).padStart(2, '0');
  const t = String(post.count).padStart(2, '0');
  document.getElementById('slide-counter').textContent = `${s} / ${t}`;
}

function updateNav() {
  const post = POSTS[currentPost];
  document.getElementById('btn-prev').disabled = currentSlide <= 1;
  document.getElementById('btn-next').disabled = currentSlide >= post.count;
}

function goToSlide(n) {
  currentSlide = n;
  setMainImg(n);
  updateCounter();
  updateNav();
  document.querySelectorAll('.thumb').forEach((el, i) => {
    el.classList.toggle('active', i + 1 === n);
  });
}

function prevSlide() { if (currentSlide > 1) goToSlide(currentSlide - 1); }
function nextSlide() {
  if (currentSlide < POSTS[currentPost].count) goToSlide(currentSlide + 1);
}

// keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  prevSlide();
  if (e.key === 'ArrowRight') nextSlide();
});

// init
loadPost('tip01');
</script>
</body>
</html>
